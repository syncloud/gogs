         ],
         "image": "syncloud/platform-buster-amd64:25.09",
         "name": "nginx test"
      },
      {
         "commands": [
            "./postgresql/build.sh"
         ],
         "image": "postgres:14-bookworm",
         "name": "postgresql"
      },
      {
         "commands": [
            "./postgresql/test.sh"
         ],
         "image": "syncloud/platform-buster-amd64:25.09",
         "name": "postgresql test"
      },
      {
         "commands": [
            "./git/build.sh"
         ],
         "image": "alpine/git:v2.36.2",
         "name": "package git"
      },
      {
         "commands": [
            "./git/test.sh"
         ],
         "image": "syncloud/platform-buster-amd64:25.09",
         "name": "git test"
      },
      {
         "commands": [
            "cd cli",
            "mkdir -p ../build/snap/meta/hooks",
            "CGO_ENABLED=0 go build -buildvcs=false -o ../build/snap/meta/hooks/install ./cmd/install",
            "CGO_ENABLED=0 go build -buildvcs=false -o ../build/snap/meta/hooks/configure ./cmd/configure",
            "CGO_ENABLED=0 go build -buildvcs=false -o ../build/snap/meta/hooks/pre-refresh ./cmd/pre-refresh",
            "CGO_ENABLED=0 go build -buildvcs=false -o ../build/snap/meta/hooks/post-refresh ./cmd/post-refresh",
            "CGO_ENABLED=0 go build -buildvcs=false -o ../build/snap/bin/cli ./cmd/cli"
         ],
         "image": "golang:1.24.0",
         "name": "cli"
      },
      {
         "commands": [
            "VERSION=$(cat version)",
            "./package.sh gogs $VERSION "
         ],
         "image": "debian:bookworm-slim",
         "name": "package"
      },
      {
         "commands": [
            "APP_ARCHIVE_PATH=$(realpath $(cat package.name))",
            "cd test",
            "./deps.sh",
            "py.test -x -s test.py --distro=bookworm --app-archive-path=$APP_ARCHIVE_PATH --app=gogs --device-user=gogs --arch=amd64"
         ],
         "image": "python:3.12-slim-bookworm",
         "name": "test bookworm"
      },
      {
         "commands": [
            "APP_ARCHIVE_PATH=$(realpath $(cat package.name))",
            "cd test",
            "./deps.sh",
            "py.test -x -s test.py --distro=buster --app-archive-path=$APP_ARCHIVE_PATH --app=gogs --device-user=gogs --arch=amd64"
         ],
         "image": "python:3.12-slim-bookworm",
         "name": "test buster"
      },
      {
         "detach": true,
         "environment": {
            "DISPLAY_CONTAINER_NAME": "selenium",
            "FILE_NAME": "video.mkv"
         },
         "image": "selenium/video:ffmpeg-4.3.1-20220208",
         "name": "selenium-video",
         "volumes": [
            {
               "name": "shm",
               "path": "/dev/shm"
            },
            {
               "name": "videos",
               "path": "/videos"
            }
         ]
      },
      {
         "commands": [
            "cd test",
            "./deps.sh",
            "pip install -r requirements.txt",
            "py.test -x -s ui.py --distro=buster --app=gogs --device-user=gogs --browser=firefox"
         ],
         "image": "python:3.12-slim-bookworm",
         "name": "test-ui"
      },
      {
         "commands": [
            "APP_ARCHIVE_PATH=$(realpath $(cat package.name))",
            "cd test",
            "./deps.sh",
            "py.test -x -s upgrade.py --distro=buster --app-archive-path=$APP_ARCHIVE_PATH --app=gogs --device-user=gogs --browser=firefox"
         ],
         "image": "python:3.12-slim-bookworm",
         "name": "test-upgrade",
         "privileged": true,
         "volumes": [
            {
               "name": "videos",
               "path": "/videos"
            }
         ]
      },
      {
         "commands": [
            "cd test",
            "./deps.sh",
            "pip install -r requirements.txt",
            "py.test -x -s ui.py --distro=buster --app=gogs --device-user=gogs --browser=firefox"
         ],
         "image": "python:3.12-slim-bookworm",
         "name": "test-ui-upgrade"
      },
      {
         "commands": [
            "PACKAGE=$(cat package.name)",
            "apt update && apt install -y wget",
            "wget https://github.com/syncloud/snapd/releases/download/1/syncloud-release-amd64 -O release --progress=dot:giga",
            "chmod +x release",
            "./release publish -f $PACKAGE -b $DRONE_BRANCH"
         ],
         "environment": {
            "AWS_ACCESS_KEY_ID": {
               "from_secret": "AWS_ACCESS_KEY_ID"
            },
            "AWS_SECRET_ACCESS_KEY": {
               "from_secret": "AWS_SECRET_ACCESS_KEY"
            }
         },
         "image": "debian:bookworm-slim",
         "name": "upload",
         "when": {
            "branch": [
               "stable",
               "master"
            ]
         }
      },
      {
         "image": "appleboy/drone-scp:1.6.4",
         "name": "artifact",
         "settings": {
            "command_timeout": "2m",
            "host": {
               "from_secret": "artifact_host"
            },
            "key": {
               "from_secret": "artifact_key"
            },
            "source": "artifact/*",
            "strip_components": 1,
            "target": "/home/artifact/repo/gogs/${DRONE_BUILD_NUMBER}-amd64",
            "timeout": "2m",
            "username": "artifact"
         },
         "when": {
            "status": [
               "failure",
               "success"
            ]
         }
      }
   ],
   "trigger": {
      "event": [
         "push",
         "pull_request"
      ]
   },
   "type": "docker",
   "volumes": [
      {
         "host": {
            "path": "/var/run/dbus"
         },
         "name": "dbus"
      },
      {
