apps:
  postgresql:
    user: git
    command: bin/service.postgresql.sh start
    #post-start-command: bin/service.postgresql.sh post-start
    daemon: forking
    plugs:
    - network
    - network-bind
    restart-condition: always
    start-timeout: 200s
    before: [server]

  server:
    user: git
    command: bin/service.server.sh start
    daemon: simple
    plugs:
    - network
    - network-bind
    restart-condition: always
    start-timeout: 200s
    after: [postgresql]

  storage-change:
    command: bin/cli storage-change

  access-change:
    command: bin/cli access-change

  backup-pre-stop:
    command: bin/cli backup-pre-stop

  restore-pre-start:
    command: bin/cli restore-pre-start

  restore-post-start:
    command: bin/cli restore-post-start

  psql:
    command: bin/psql.sh

  pgdumpall:
    command: bin/pg_dumpall.sh

confinement: strict
description: Distributed version control system
grade: stable
name: gogs
summary: GOGS git server
